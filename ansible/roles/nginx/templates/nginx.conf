events {
  worker_connections 768;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    server_name _;

    location / {
      return 200 "Hello, world";
    }
  }
{% for site in nginx_redirect_sites %}
  server {
    server_name {{ site.domain }};
    return 302 {{ site.redirect_url }};

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/{{ nginx_cert_domain }}/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/{{ nginx_cert_domain }}/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
  }
{% endfor %}
  server {
    server_name {{ nginx_static_site.domain }};

    root {{ nginx_static_site.root }};
    index index.html index.htm;

    location / {
      try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/{{ nginx_cert_domain }}/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/{{ nginx_cert_domain }}/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
  }
{% for site in nginx_redirect_sites + [nginx_static_site] %}
  server {
    if ($host = {{ site.domain }}) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name {{ site.domain }};
    return 404; # managed by Certbot
  }
{% endfor %}
}
